name: Self-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: scan
      - run: echo "score=${{ steps.scan.outputs.score }} url=${{ steps.scan.outputs.report-url }}"
